<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1411" />
    <title>Noemune</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161d19'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23b98ae0' stroke-width='2.6'/%3E%3Ccircle cx='12.4' cy='16.8' r='3.9' fill='%23b98ae0'/%3E%3Ccircle cx='20.3' cy='11.4' r='2.5' fill='%23ee7c9c'/%3E%3Ccircle cx='20.5' cy='20.9' r='2.5' fill='%23ee7c9c'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint. Dark unless someone chose otherwise.
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("noemune:theme") || "dark"; } catch (e) {}
        var light = t === "light" || (t === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.className = light ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
