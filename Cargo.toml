[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/runner", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/noemune/noemune"

[workspace.dependencies]
noemune-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
url = "2"

[workspace.lints.clippy]
# Row tuples from sqlx read fine inline.
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
