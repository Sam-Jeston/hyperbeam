[package]
name = "hyperbeam-server"
description = "Hyperbeam control plane: API, scheduler, tool gateway, git proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hyperbeam-server"
path = "src/main.rs"

[dependencies]
hyperbeam-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
reqwest.workspace = true
async-trait.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = "0.5"
aes-gcm = "0.10"
jsonwebtoken = "9"
kube = { version = "1", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.25", features = ["v1_31"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

[dev-dependencies]
clap.workspace = true

[lints]
workspace = true
