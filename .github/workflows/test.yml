# The test suite: the web app and docs build, clippy, and every Rust test,
# including the end-to-end tests, which need a Postgres.
#
# Runs on pull requests, and is called by the Images workflow, which
# publishes nothing unless this passes.
name: Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hyperbeam
          POSTGRES_PASSWORD: hyperbeam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyperbeam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without this the end-to-end tests skip themselves and still pass.
      HYPERBEAM_TEST_DATABASE_URL: postgres://hyperbeam:hyperbeam@127.0.0.1:5432/postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      # The server embeds web/dist, so the web app is built before any Rust.
      - name: Web app
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      # Fails on a link to a page or heading that does not exist.
      - name: Docs
        working-directory: docs
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The end-to-end tests start these as real processes.
      - name: Build the runner and the test agent
        run: cargo build --locked -p hyperbeam-runner -p hyperbeam-test-agent
      - name: Tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          cargo test --workspace --locked
