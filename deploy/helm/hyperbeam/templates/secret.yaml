{{- if not .Values.existingSecret }}
{{- $name := include "hyperbeam.name" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pgPassword := .Values.postgres.password }}
{{- if and (not $pgPassword) $existing }}
{{- $pgPassword = index $existing.data "postgres-password" | default "" | b64dec }}
{{- end }}
{{- if not $pgPassword }}
{{- $pgPassword = randAlphaNum 32 }}
{{- end }}
{{- $external := include "hyperbeam.externalMasterKey" . }}
{{- $masterKey := .Values.masterKey }}
{{- if and (not $masterKey) (not $external) $existing }}
{{- $masterKey = index $existing.data "master-key" | default "" | b64dec }}
{{- end }}
{{- if and (not $masterKey) (not $external) }}
{{- fail "masterKey is required: generate one with `openssl rand -base64 32` and keep it safe, or set aws.masterKeySecret or aws.kmsKeyId" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hyperbeam.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not $external }}
  master-key: {{ $masterKey | quote }}
  {{- end }}
  postgres-password: {{ $pgPassword | quote }}
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- else }}
  database-url: {{ printf "postgres://hyperbeam:%s@%s-postgres:5432/hyperbeam" $pgPassword $name | quote }}
  {{- end }}
{{- end }}
