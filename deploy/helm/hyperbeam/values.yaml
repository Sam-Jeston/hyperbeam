image:
  repository: ghcr.io/sam-jeston/hyperbeam/server
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# URL people use to reach the UI. Used in invite links and pull request footers.
publicUrl: http://localhost:8080

# Encrypts stored credentials. Generate with `hyperbeam-server gen-key` or
# `openssl rand -base64 32`. Losing it makes stored credentials unreadable.
# Alternatively point existingSecret at a Secret with keys `master-key` and
# `database-url`.
masterKey: ""
existingSecret: ""

# Keep the master key in AWS instead of setting masterKey. Set one of the two.
# The server needs AWS credentials: on EKS, annotate its service account with
# an IAM role (serviceAccount.annotations) or use Pod Identity.
aws:
  # Name or ARN of a Secrets Manager secret holding the key (the base64 text,
  # or JSON with it under `master_key`). Needs secretsmanager:GetSecretValue.
  masterKeySecret: ""
  # ID, alias or ARN of a KMS key. The master key is generated on first start
  # and stored in Postgres wrapped under it, so there is no key to hand over or
  # back up. Needs kms:GenerateDataKey and kms:Decrypt.
  kmsKeyId: ""
  # Only needed when the above is not an ARN and the pod has no AWS_REGION.
  region: ""

serviceAccount:
  # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/hyperbeam
  annotations: {}

database:
  # Connection URL of an external Postgres. Leave empty to use the bundled one.
  url: ""

# A single-instance Postgres, good enough to start with. For anything you
# care about, run Postgres properly and set database.url instead.
postgres:
  enabled: true
  image: postgres:16
  storage: 10Gi
  storageClassName: ""
  password: ""       # generated on first install when empty

agents:
  # Namespace agent pods run in. Created by the chart.
  namespace: hyperbeam-agents
  runnerImage:
    repository: ghcr.io/sam-jeston/hyperbeam/runner
    tag: ""
  imagePullPolicy: IfNotPresent
  cpuLimit: "2"
  memoryLimit: 4Gi
  workspaceSize: 10Gi
  maxSessions: 20
  idleTimeoutSeconds: 900

egress:
  # Route all sandbox traffic through Hyperbeam's allowlist proxy and block
  # everything else with a NetworkPolicy. Needs a CNI that enforces
  # NetworkPolicy (Calico, Cilium, ...); without one the policy is ignored
  # and only well-behaved clients are constrained.
  enforce: true
  # Hosts every sandbox may reach, beyond each harness profile's own.
  allow:
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    - crates.io
    - static.crates.io
    - index.crates.io
    - proxy.golang.org
    - sum.golang.org
  # Labels of the namespace cluster DNS runs in.
  dnsNamespaceLabels:
    kubernetes.io/metadata.name: kube-system

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

extraEnv: []
