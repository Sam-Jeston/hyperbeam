{{- if not .Values.existingSecret }}
{{- $name := include "noemune.name" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pgPassword := .Values.postgres.password }}
{{- if and (not $pgPassword) $existing }}
{{- $pgPassword = index $existing.data "postgres-password" | default "" | b64dec }}
{{- end }}
{{- if not $pgPassword }}
{{- $pgPassword = randAlphaNum 32 }}
{{- end }}
{{- $masterKey := .Values.masterKey }}
{{- if and (not $masterKey) $existing }}
{{- $masterKey = index $existing.data "master-key" | default "" | b64dec }}
{{- end }}
{{- if not $masterKey }}
{{- fail "masterKey is required: generate one with `openssl rand -base64 32` and keep it safe" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "noemune.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ $masterKey | quote }}
  postgres-password: {{ $pgPassword | quote }}
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- else }}
  database-url: {{ printf "postgres://noemune:%s@%s-postgres:5432/noemune" $pgPassword $name | quote }}
  {{- end }}
{{- end }}
